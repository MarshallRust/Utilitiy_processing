# Each top-level key is a field to extract. "pattern" is the regex used to
# pull the value out of the matched line. "validate" names a validator in
# ocr.py to run on the match before accepting it (currently just "date").
# "parser" names a custom parser in ocr.py instead of the default
# regex-match behavior, for fields whose value can't be pulled out with a
# plain pattern (amount, service_address).
#
# Under each field, "enbridge" and "logan" hold the per-company crop box
# (left, top, right, bottom in pixels), the OCR search term to look for on
# the page ("term_optional: true" also accepts the value without its label),
# and whether OCR needs tessedit_do_invert=1 (Logan's bills use
# white text on a colored background for labels; Enbridge doesn't).

# Date fields (both companies) use a fixed OCR config
# instead of the generic ramp-up-by-retry one - the generic whitelist never
# includes '/', so a date like '10/13/2025' can never match until the
# retries lucked into an unrestricted whitelist. This one always includes
# '/' and ':'. Logan's also turns on classify_bln_numeric_mode, matching
# what V3's Dates class used for non-Enbridge bills. Logan's date boxes
# point at the lower tables on the bill (Bill Date / Due Date on the
# right, Service Period on the left) - the matching rows in the top table
# OCR inconsistently. Repeated below instead
# of shared via a YAML anchor - main.py loops over every top-level key in
# this file as if it were a real field, so nothing non-field-shaped can
# live at the top level.

bill_date:
  pattern: '\b\d{1,2}/\d{1,2}/\d{4}\b'
  validate: date
  enbridge:
    box: [1100, 270, 2350, 420]  # "Account Summary as of 10/21/2026", top right
    term: "As of"
    invert: false
    whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz,.:-/ "
  logan:
    box: [1400, 1300, 2350, 1500]  # "Bill Date" row of the lower-right table
    term: "Bill Date"
    invert: true
    psm: 6
    whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz,.:-/ "
    extra_config: "-c classify_bln_numeric_mode=1"

due_date:
  pattern: '\b\d{1,2}/\d{1,2}/\d{4}\b'
  validate: date
  enbridge:
    box: [1100, 520, 2350, 680]  # small print under the total: "...charged on balance on or after 11/12/2026."
    term: "or after"  # "Past Due After" is on a different OCR line than its date on Enbridge bills - "or after" catches the same date from a different sentence on the same line
    invert: false
    whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz,.:-/ "
  logan:
    box: [1400, 1300, 2350, 1500]  # "Due Date" row of the lower-right table
    term: "Due Date"
    invert: true
    psm: 6
    whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz,.:-/ "
    extra_config: "-c classify_bln_numeric_mode=1"

effective_dates:
  pattern: '\d{1,2}/\d{1,2}/\d{4}\s*-\s*\d{1,2}/\d{1,2}/\d{4}'
  enbridge:
    box: [1080, 700, 2350, 870]  # "Service from 9/24/2026 - 10/19/2026", right column
    term: "Service from"
    invert: false
    whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz,.:-/ "
  logan:
    box: [60, 1360, 1380, 1460]  # "Service Period" row of the lower-left table
    term: "Service Period"
    term_optional: true  # the date range is unique on the page - accept it even if the shaded label doesn't OCR
    invert: true
    psm: 6
    whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz,.:-/ "
    extra_config: "-c classify_bln_numeric_mode=1"

amount:
  parser: amount
  enbridge:
    box: [1100, 460, 2350, 660]  # "Total Amount Due Upon Receipt $14.76"
    term: "$"
    invert: false
  logan:
    box: [1400, 745, 2350, 830]
    term: "Total Amount Due"
    invert: true

service_address:
  parser: address
  enbridge:
    box: [50, 590, 1250, 720]
    term: "Service Address"
    invert: false
    psm: 6
  logan:
    box: [1400, 520, 2350, 650]
    term: "Service Address"
    invert: true
    psm: 6
